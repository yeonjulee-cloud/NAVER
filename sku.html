<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SKU · FBN 운영 가이드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --ink:#181a20; --ink-soft:#61667a; --ink-faint:#9297a8;
    --line:#e5e7ee; --line-soft:#eef0f5; --surface:#ffffff; --canvas:#f7f8fb;
    --brand:#3452d6; --brand-ink:#24378f; --brand-wash:#ecf0fd; --brand-wash-strong:#dee5fb;
    --amber:#b5680a; --amber-wash:#fbf0dd;
    --r-sm:7px; --r-md:12px; --r-lg:20px;
    --sh-1: 0 1px 2px rgba(20,23,35,0.06);
    --font-ui: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono: "JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--surface); color:var(--ink); font-family:var(--font-ui); -webkit-font-smoothing:antialiased; }
  body { padding: 40px 44px 64px; max-width: 900px; }
  @media (max-width: 640px) { body { padding: 22px 18px 48px; } }
  .doc-eyebrow { font-size:11.5px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:var(--brand); margin:0 0 10px; }
  .doc-title { font-size:25px; font-weight:900; letter-spacing:-0.01em; line-height:1.35; margin:0 0 10px; }
  .doc-meta { font-size:13px; color:var(--ink-soft); margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line-soft); }
  .doc-body { font-size:15px; line-height:1.85; max-width:74ch; }
  .doc-body > *:first-child { margin-top:0; }
  .doc-body h2 { font-size:16.5px; font-weight:800; padding-bottom:8px; border-bottom:1px solid var(--line-soft); margin:28px 0 12px; }
  .doc-body p { margin:0 0 14px; }
  .doc-body ul, .doc-body ol { margin:0 0 14px; padding-left:22px; }
  .doc-body li { margin:5px 0; }
  .placeholder-box {
    border:1.5px dashed var(--line); border-radius:var(--r-md); background:var(--canvas);
    padding:28px 22px; color:var(--ink-soft); font-size:13.5px; line-height:1.8;
  }
  .placeholder-box b { color: var(--ink); }
  .doc-tags { margin-top:30px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:12px; background:var(--canvas); color:var(--ink-soft); padding:4px 10px; border-radius:999px; }
</style>
</head>
<body>
<p class="doc-eyebrow">SKU</p>
<h1 class="doc-title">SKU</h1>
<div class="doc-meta">관리자 · 2026.09.21</div>
<div class="doc-body">
<div class="placeholder-box"><b>SKU</b> 사용법을 여기에 작성하세요. (화면 경로, 입력 항목, 주의사항, 예시 등)</div>
</div>
<div class="doc-tags"><span class="tag">#SKU</span></div>
</body>
</html>
